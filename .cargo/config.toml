# Repository-local cargo configuration. Merged with (not replacing) the user's
# global ~/.cargo/config.toml.
# See docs/dev/build-workflow.md for verification tiers.

[alias]
# Inner loop: type-check only, no codegen, no link.
ck = "check"
# Verify one integration test target, e.g. `cargo t1 cli_article`.
# Skips the unit-test compilation and unrelated test binaries.
t1 = ["test", "--test"]
