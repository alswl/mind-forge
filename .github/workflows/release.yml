name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag: $TAG (expected v<MAJOR>.<MINOR>.<PATCH>)"
            exit 1
          fi

  build:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Check Go source
        run: bash scripts/check.sh
      - name: Build and validate four release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v6
        with:
          name: mf-release-${{ github.sha }}
          path: |
            release/${{ github.ref_name }}/*.tar.gz
            release/${{ github.ref_name }}/checksums.txt
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mf-release-${{ github.sha }}
          path: dist
      - name: Verify packaged checksums
        working-directory: dist
        run: sha256sum -c checksums.txt
      - name: Find previous public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "Previous published release: ${previous_tag:-<none>}"
          echo "prev_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
        id: notes
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          previous_tag: ${{ steps.notes.outputs.prev_tag }}
          files: dist/*
