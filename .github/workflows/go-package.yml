name: Prepare Go candidate archives

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/go-package.yml'
      - '.tool-versions'
      - 'Makefile'
      - 'VERSION'
      - 'hack/bump-post-actions.sh'
      - 'hack/check-version.sh'
      - 'hack/.upstream-makefile-go'
      - '.gitmodules'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'pkg/**'
      - 'internal/**'
      - 'hack/release-checks.sh'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Archive version tag, for example v0.6.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Build and validate all four archives
        env:
          PACKAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$PACKAGE_TAG" ]]; then
            make package PACKAGE_TAG="$PACKAGE_TAG"
          else
            make package
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: mf-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
