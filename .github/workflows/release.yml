name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid tag: $TAG (expected v<MAJOR>.<MINOR>.<PATCH>)"
            exit 1
          fi

  build:
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-shared-key: ci-${{ runner.os == 'Linux' && 'build' || 'build-macos' }}-${{ matrix.target }}
      - name: Install protobuf compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protobuf compiler
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Zig
        if: runner.os == 'Linux'
        run: |
          curl --retry 3 -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o /tmp/zig.tar.xz
          echo '473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  /tmp/zig.tar.xz' | sha256sum -c -
          tar xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.24.1
          checksum: true
          fallback: none
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build macOS
        if: runner.os == 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          target='${{ matrix.target }}'
          archive="mf-${GITHUB_REF_NAME}-${target}.tar.gz"
          cp "target/${target}/release/mf" "mf-${target}"
          tar czf "$archive" "mf-${target}"
      - uses: actions/upload-artifact@v6
        with:
          name: mf-${{ matrix.target }}
          path: mf-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      - name: Find previous public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "Previous published release: ${previous_tag:-<none>}"
          echo "prev_tag=${previous_tag}" >> "$GITHUB_OUTPUT"
        id: notes
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          previous_tag: ${{ steps.notes.outputs.prev_tag }}
          files: dist/*
