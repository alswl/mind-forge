name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['README.md', 'docs/**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: scope
        with:
          script: |
            if (context.eventName !== 'push' || context.ref === 'refs/heads/master') {
              return true;
            }
            try {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.ref.slice('refs/heads/'.length)}`,
                base: 'master',
                per_page: 100,
              });
              return !pulls.some(pr => pr.head.sha === context.sha);
            } catch (error) {
              core.warning(`PR lookup failed; running full CI: ${error.message}`);
              return true;
            }

  quality:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-quality
          cache-on-failure: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: cargo fmt --check

  build:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-${{ matrix.target }}
          cache-on-failure: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Zig
        run: |
          curl --retry 3 -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o /tmp/zig.tar.xz
          echo '473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  /tmp/zig.tar.xz' | sha256sum -c -
          tar xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-zigbuild@0.24.1
          checksum: true
          fallback: none
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: mf-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mf
          retention-days: 7
          if-no-files-found: error

  build-macos:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build-macos-${{ matrix.target }}
          cache-on-failure: true
      - name: Install protobuf compiler
        run: brew install protobuf
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: mf-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/mf
          retention-days: 7
          if-no-files-found: error
