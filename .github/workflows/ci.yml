name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['README.md', 'docs/**/*.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-quality:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Verify report source and embedded assets
        run: make check-report-source
      - name: Install pinned Go linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: make check
      - name: Record validated candidate source identity
        id: candidate
        run: |
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64
          test -z "$(git status --porcelain)"
          revision=$(git rev-parse HEAD)
          bin/mf version --json > bin/version.json
          go version -m bin/mf > bin/build-info.txt
          go version -m bin/mf-report > bin/report-build-info.txt
          bin/mf-report --version > bin/report-version.txt
          for build_info in bin/build-info.txt bin/report-build-info.txt; do
            awk -F '\t' -v revision="$revision" '$2 == "build" && $3 == ("vcs.revision=" revision) {found=1} END {exit !found}' "$build_info"
          done
          printf 'revision=%s\ndirty=false\ngo_version=%s\n' "$revision" "$(go env GOVERSION)" > bin/source.txt
          (cd bin && sha256sum mf mf-report > checksums.txt)
          mf_sha=$(awk '$2 == "mf" {print $1; found++} END {exit found != 1}' bin/checksums.txt)
          printf 'sha256=%s\n' "$mf_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: mf-go-${{ github.sha }}-linux-amd64
          path: |
            bin/mf
            bin/mf-report
            bin/report-build-info.txt
            bin/report-version.txt
            bin/version.json
            bin/build-info.txt
            bin/source.txt
            bin/checksums.txt
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact: mf-go-${{ github.sha }}-linux-amd64
      sha256: ${{ steps.candidate.outputs.sha256 }}

  scope:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.result }}
    steps:
      - uses: actions/github-script@v8
        id: scope
        with:
          script: |
            if (context.eventName !== 'push' || context.ref === 'refs/heads/master') {
              return true;
            }
            try {
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                head: `${context.repo.owner}:${context.ref.slice('refs/heads/'.length)}`,
                base: 'master',
                per_page: 100,
              });
              return !pulls.some(pr => pr.head.sha === context.sha);
            } catch (error) {
              core.warning(`PR lookup failed; running full CI: ${error.message}`);
              return true;
            }
